<!DOCTYPE html>
<html lang="en">
    <head>
        <title>CLASSIC *@POPCAT@*</title>
        <style>
            .container{
                background-color: #286400;
                height: 100vh;

                display: flex;
                flex-direction: column;
                align-items: center;
            }
            .title{
                margin-top: 2em; /*2倍字寬*/
                width: 80%;
                max-width: 600px;
            }
            .cat-img{
                flex: 1;                

                background-size: contain;
                background-position: bottom;
                background-repeat: no-repeat;                

                text-align: center;
                color: white;
                font-size: 80px;
                font-weight: 900;
                -webkit-text-stroke: 3px black ;
                width: 100%;
                max-width: 800px;
            }
            #p{
                background-image: url("imgs/p.png");
            }
            #op{
                background-image: url("imgs/op.png");
            }
        </style>
    </head>
    <body>
        <div class="container">
        <img class="title" src="imgs\popcat.svg" alt="POPCAT">
        <div class="cat-img" id="p" >30000</div>
        </div>
    </body>        

</html>
